# 模型注册表。variant: rknn = NPU 官方转换, rknn-2.3.2 = 自转(toolkit2 2.3.2), cpu = onnxruntime fp32 基线。
# 官方 RKNN zipformer 实为 fp16（非 int8）且在 RK3576 上输出异常（sherpa-onnx#2861）；
# zipformer 的正式 NPU 版是自转 rknn-2.3.2，官方 rknn 仅留作对照。无 url 的变体为手动产物，下载器跳过。
# url 中 rk3576 与 rk3588 模型按 sherpa-onnx 官方说明可互换使用（同 RKNPU2 代）。
asr:
  zipformer-small-bilingual:
    desc: streaming zipformer small 中英双语 (2023-02-16)
    streaming: true
    languages: [zh, en]
    variants:
      # 官方版 RK3576 上输出全 blank（#2861），仅留作报告对照
      rknn:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-rk3576-streaming-zipformer-small-bilingual-zh-en-2023-02-16.tar.bz2
      # 正式 NPU 版：用户 x86 PC 自转（toolkit2 2.3.2 + scripts/convert_rknn.py，fp16，
      # 输入为 cpu/96/ 的 chunk96 fp32 ONNX），板上 5/5 冒烟通过，RTF 0.15–0.19。
      # CPU 对照须用 cpu/96/ 子目录保持同 chunk 口径。
      rknn-2.3.2:
        note: self-converted via scripts/convert_rknn.py --target-platform rk3576
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16.tar.bz2
  zipformer-large-bilingual:
    desc: streaming zipformer 中英双语 大杯 (2023-02-20)
    streaming: true
    languages: [zh, en]
    variants:
      # 官方版未下载（#2861 叠词问题暂缓）；正式 NPU 版 = 自转 rknn-2.3.2（chunk32 变体）
      rknn-2.3.2:
        note: self-converted via scripts/convert_rknn.py --target-platform rk3576
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
  # SenseVoice 移出当前范围（用户 2026-10-09 拍板，后续需要再补）
  sensevoice:
    enabled: false
    desc: SenseVoice-Small 中英日韩粤 (RKNN 为 20s 定长版, 需 VAD 分段)
    streaming: false
    languages: [zh, en, ja, ko, yue]
    variants:
      rknn:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-rk3576-20-seconds-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
  whisper-base:
    desc: Whisper base (P4 自转 RKNN; 先备 CPU 基线)
    streaming: false
    languages: [zh, en, ja, ko, yue]
    variants:
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2

# VAD，SenseVoice 长音频分段用（P2 恢复时再用）
aux:
  silero-vad:
    url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
    dest: models/silero_vad.onnx
  # Matcha 声码器（散文件，直接放 models/vocos/）
  # ⚠️ matcha-icefall-zh-en 是 16kHz 模型（sherpa 对 22k vocos 有明确错配告警），必须用 16k 版；
  # 22khz 版系 2026-10-09 错配（CPU matcha 首轮数据 1.38× 快进，已作废重测）
  vocos:
    url: https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos-16khz-univ.onnx
    dest: models/vocos/vocos-16khz-univ.onnx

# TTS：全部先跑 CPU（fp32）；RKNN 化尝试在 P4。Matcha 需搭配 aux.vocos 声码器。
# MMS 官方 sherpa 只打包了 eng（无 zh/ja/ko/yue），只作 en 地板。
tts:
  piper-zh-huayan:
    desc: Piper VITS zh 华颜 medium（CPU 基线）
    languages: [zh]
    variants:
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-zh_CN-huayan-medium.tar.bz2
  piper-en-ryan:
    desc: Piper VITS en ryan medium（CPU 基线）
    languages: [en]
    variants:
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-ryan-medium.tar.bz2
  matcha-zh-en:
    desc: Matcha 中英双语 + vocos 声码器（RKNN 主力候选，先 CPU）
    languages: [zh, en]
    needs: [vocos]
    variants:
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/matcha-icefall-zh-en.tar.bz2
      # NPU 版：用户 PC 自转（rkvoice-stream 方案，encoder+estimator 拆分 fp16 + vocos-16khz fp16，
      # 转换说明 scripts/matcha-rknn/README.md；注意 vocoder 是 16kHz 版，与 cpu 的 22kHz 不同）
      rknn:
        note: self-converted via scripts/matcha-rknn/ (vendored from rkvoice-stream, Apache 2.0)
  kokoro:
    desc: Kokoro-82M 多语 v1.1（CPU 先行，NPU 进阶）
    languages: [zh, en, ja, ko, yue]
    variants:
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_1.tar.bz2
  mms-eng:
    desc: MMS-TTS en（多语言地板，sherpa 未打包 zh）
    languages: [en]
    variants:
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-mms-eng.tar.bz2
