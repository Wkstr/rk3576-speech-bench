# 模型注册表。variant: rknn = NPU 官方转换, rknn-2.3.2 = 自转(toolkit2 2.3.2), cpu = onnxruntime fp32 基线。
# 官方 RKNN zipformer 实为 fp16（非 int8）且在 RK3576 上输出异常（sherpa-onnx#2861）；
# zipformer 的正式 NPU 版是自转 rknn-2.3.2，官方 rknn 仅留作对照。无 url 的变体为手动产物，下载器跳过。
# url 中 rk3576 与 rk3588 模型按 sherpa-onnx 官方说明可互换使用（同 RKNPU2 代）。
asr:
  zipformer-small-bilingual:
    desc: streaming zipformer small 中英双语 (2023-02-16)
    streaming: true
    languages: [zh, en]
    variants:
      # 官方版 RK3576 上输出全 blank（#2861），仅留作报告对照
      rknn:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-rk3576-streaming-zipformer-small-bilingual-zh-en-2023-02-16.tar.bz2
      # 正式 NPU 版：用户 x86 PC 自转（toolkit2 2.3.2 + scripts/convert_rknn.py，fp16，
      # 输入为 cpu/96/ 的 chunk96 fp32 ONNX），板上 5/5 冒烟通过，RTF 0.15–0.19。
      # CPU 对照须用 cpu/96/ 子目录保持同 chunk 口径。
      rknn-2.3.2:
        note: self-converted via scripts/convert_rknn.py --target-platform rk3576
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16.tar.bz2
  zipformer-large-bilingual:
    desc: streaming zipformer 中英双语 大杯 (2023-02-20)
    streaming: true
    languages: [zh, en]
    variants:
      rknn:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-rk3576-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
  sensevoice:
    desc: SenseVoice-Small 中英日韩粤 (RKNN 为 20s 定长版, 需 VAD 分段)
    streaming: false
    languages: [zh, en, ja, ko, yue]
    variants:
      rknn:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-rk3576-20-seconds-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
  whisper-base:
    desc: Whisper base (P4 自转 RKNN; 先备 CPU 基线)
    streaming: false
    languages: [zh, en, ja, ko, yue]
    variants:
      cpu:
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2

# VAD，SenseVoice 长音频分段用
aux:
  silero-vad:
    url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
    dest: models/silero_vad.onnx

# P3 填入 TTS 条目
tts: {}
